<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Notes</title>
<style>
  /* ===================== THEME VARIABLES ===================== */
  :root {
    /* light theme (default) */
    --bg: #f0f0f0;
    --panel: #ffffff;
    --panel-2: #fafafa;
    --panel-3: #f5f5f5;
    --border: #d0d0d0;
    --border-2: #e5e5e5;
    --text: #1a1a1a;
    --text-2: #444;
    --text-3: #666;
    --text-4: #888;
    --text-5: #999;
    --accent: #0078d4;
    --accent-2: #0067b8;
    --output-text: #1a6b1a;
    --output-error: #a02020;
    --code-bg: #ffffff;
    --notes-bg: #ffffff;
    --btn-bg: #ffffff;
    --btn-border: #c8c8c8;
    --btn-hover: #f0f0f0;
    --danger: #a02020;
    --danger-border: #e0b0b0;
    --danger-hover: #fdeaea;
    --pill-bg: #e6f2fb;
    --pill-text: #0a5a91;
    --pill-saved-bg: #e2f3e6;
    --pill-saved-text: #1e6b3b;
    --pill-error-bg: #fde8e8;
    --pill-error-text: #a02020;
    --footer-bg: #ededed;
    --tab-active-bg: #ffffff;
    --md-code-bg: #eeeeee;
    --shadow: rgba(0, 0, 0, 0.08);
  }

  html.dark {
    --bg: #1e1e1e;
    --panel: #252526;
    --panel-2: #2d2d30;
    --panel-3: #333337;
    --border: #3e3e42;
    --border-2: #3e3e42;
    --text: #e8e8e8;
    --text-2: #d0d0d0;
    --text-3: #b0b0b0;
    --text-4: #888;
    --text-5: #777;
    --accent: #4ea8f0;
    --accent-2: #5cb0f5;
    --output-text: #86efac;
    --output-error: #f87171;
    --code-bg: #1e1e1e;
    --notes-bg: #1e1e1e;
    --btn-bg: #333337;
    --btn-border: #4a4a4f;
    --btn-hover: #3e3e42;
    --danger: #f87171;
    --danger-border: #6b3a3a;
    --danger-hover: #2d1a1a;
    --pill-bg: #1e3a5f;
    --pill-text: #93c5fd;
    --pill-saved-bg: #1a3a2a;
    --pill-saved-text: #86efac;
    --pill-error-bg: #3a1a1a;
    --pill-error-text: #fca5a5;
    --footer-bg: #252526;
    --tab-active-bg: #2d2d30;
    --md-code-bg: #3a3a3e;
    --shadow: rgba(0, 0, 0, 0.4);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Segoe UI', 'Calibri', Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    height: 100vh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    transition: background 0.2s, color 0.2s;
  }

  /* ---------- Top title bar ---------- */
  .titlebar {
    background: var(--panel-3);
    border-bottom: 1px solid var(--border);
    padding: 8px 14px;
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 13px;
    color: var(--text-2);
    user-select: none;
    transition: background 0.2s, border 0.2s;
  }
  .titlebar .app-name {
    font-weight: 600;
    color: var(--text);
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .titlebar .app-name .logo {
    width: 18px; height: 18px;
    background: var(--accent);
    border-radius: 3px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    color: white;
    font-size: 11px;
    font-weight: bold;
  }
  .titlebar .spacer { flex: 1; }
  .titlebar .status-pill {
    background: var(--pill-bg);
    color: var(--pill-text);
    font-size: 11px;
    padding: 2px 10px;
    border-radius: 10px;
    font-weight: 500;
    transition: background 0.2s, color 0.2s;
  }
  .titlebar .status-pill.saved { background: var(--pill-saved-bg); color: var(--pill-saved-text); }
  .titlebar .status-pill.error { background: var(--pill-error-bg); color: var(--pill-error-text); }

  .titlebar .theme-btn {
    background: var(--btn-bg);
    border: 1px solid var(--btn-border);
    color: var(--text-2);
    font-size: 11px;
    font-family: inherit;
    padding: 4px 10px;
    border-radius: 12px;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    gap: 4px;
    transition: all 0.15s;
  }
  .titlebar .theme-btn:hover { background: var(--btn-hover); }
  .titlebar .theme-btn:active { transform: scale(0.96); }

  /* ---------- Main area ---------- */
  .main {
    flex: 1;
    display: flex;
    overflow: hidden;
    background: var(--bg);
    transition: background 0.2s;
  }

  /* ---------- NOTES PANE (left) ---------- */
  .notes-pane {
    flex: 1;
    display: flex;
    flex-direction: column;
    background: var(--panel);
    border-right: 1px solid var(--border);
    min-width: 0;
    transition: background 0.2s, border 0.2s;
  }
  .notes-pane .pane-toolbar {
    background: var(--panel-2);
    border-bottom: 1px solid var(--border-2);
    padding: 6px 14px;
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 12px;
    color: var(--text-3);
    transition: background 0.2s, border 0.2s, color 0.2s;
  }
  .notes-pane .pane-toolbar .tool {
    padding: 3px 8px;
    border-radius: 4px;
    cursor: default;
    color: var(--text-2);
  }
  .notes-pane .pane-toolbar .tool:hover { background: var(--btn-hover); }
  .notes-pane .pane-toolbar .sep {
    width: 1px; height: 14px; background: var(--border); margin: 0 4px;
  }
  .notes-pane .pane-toolbar .spacer { flex: 1; }

  #noteArea {
    flex: 1;
    width: 100%;
    border: none;
    outline: none;
    resize: none;
    padding: 24px 32px;
    font-family: 'Calibri', 'Segoe UI', Arial, sans-serif;
    font-size: 16px;
    line-height: 1.7;
    color: var(--text);
    background: var(--notes-bg);
    caret-color: var(--accent);
    transition: background 0.2s, color 0.2s;
  }
  #noteArea::placeholder { color: var(--text-5); font-style: italic; }

  .notes-pane .pane-footer {
    background: var(--panel-2);
    border-top: 1px solid var(--border-2);
    padding: 5px 14px;
    display: flex;
    align-items: center;
    gap: 12px;
    font-size: 11px;
    color: var(--text-4);
    transition: background 0.2s, border 0.2s, color 0.2s;
  }
  .notes-pane .pane-footer .spacer { flex: 1; }
  .notes-pane .pane-footer button {
    background: var(--btn-bg);
    border: 1px solid var(--btn-border);
    color: var(--text-2);
    padding: 4px 10px;
    border-radius: 3px;
    font-size: 11px;
    font-family: inherit;
    cursor: pointer;
    transition: all 0.15s;
  }
  .notes-pane .pane-footer button:hover { background: var(--btn-hover); }
  .notes-pane .pane-footer button.danger { color: var(--danger); border-color: var(--danger-border); }
  .notes-pane .pane-footer button.danger:hover { background: var(--danger-hover); }

  /* ---------- RUNNER PANE (right) ---------- */
  .runner-pane {
    width: 46%;
    min-width: 360px;
    display: flex;
    flex-direction: column;
    background: var(--panel-3);
    transition: background 0.2s;
  }

  .runner-pane .tabs {
    background: var(--panel-2);
    border-bottom: 1px solid var(--border-2);
    padding: 6px 10px 0 10px;
    display: flex;
    gap: 2px;
    overflow-x: auto;
    flex-shrink: 0;
    transition: background 0.2s, border 0.2s;
  }
  .runner-pane .tabs::-webkit-scrollbar { height: 4px; }
  .runner-pane .tabs::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

  .tab {
    background: transparent;
    border: 1px solid transparent;
    border-bottom: none;
    color: var(--text-3);
    padding: 6px 12px;
    font-size: 12px;
    font-family: inherit;
    cursor: pointer;
    border-radius: 4px 4px 0 0;
    white-space: nowrap;
    display: flex;
    align-items: center;
    gap: 4px;
    transition: all 0.15s;
  }
  .tab:hover { background: var(--btn-hover); color: var(--text); }
  .tab.active {
    background: var(--tab-active-bg);
    border-color: var(--border-2);
    color: var(--accent);
    font-weight: 600;
    position: relative;
    top: 1px;
  }
  .tab[data-lang="html"].active { color: #e34c26; }
  .tab[data-lang="js"].active   { color: #b8860b; }
  .tab[data-lang="py"].active   { color: #3572A5; }
  .tab[data-lang="json"].active { color: #b8860b; }
  .tab[data-lang="xml"].active  { color: #e34c26; }
  .tab[data-lang="md"].active   { color: #083fa1; }
  html.dark .tab[data-lang="js"].active,
  html.dark .tab[data-lang="json"].active { color: #fcd34d; }
  html.dark .tab[data-lang="py"].active   { color: #60a5fa; }
  html.dark .tab[data-lang="md"].active   { color: #93c5fd; }

  .runner-pane .editor-header {
    background: var(--panel);
    border-bottom: 1px solid var(--border-2);
    padding: 5px 12px;
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 11px;
    color: var(--text-4);
    transition: background 0.2s, border 0.2s, color 0.2s;
  }
  .runner-pane .editor-header .lang-name { font-weight: 600; color: var(--text-2); }
  .runner-pane .editor-header .spacer { flex: 1; }

  .runner-pane .split {
    flex: 1;
    display: flex;
    flex-direction: column;
    min-height: 0;
  }

  #codeEditor {
    flex: 1;
    width: 100%;
    border: none;
    outline: none;
    resize: none;
    padding: 14px 16px;
    font-family: 'Consolas', 'Cascadia Code', 'Courier New', monospace;
    font-size: 13px;
    line-height: 1.55;
    background: var(--code-bg);
    color: var(--text);
    caret-color: var(--accent);
    min-height: 120px;
    transition: background 0.2s, color 0.2s;
  }

  .output-wrap {
    border-top: 1px solid var(--border-2);
    background: var(--panel-2);
    display: flex;
    flex-direction: column;
    max-height: 50%;
    min-height: 130px;
    transition: background 0.2s, border 0.2s;
  }
  .output-header {
    padding: 5px 12px;
    font-size: 11px;
    color: var(--text-4);
    background: var(--panel-3);
    border-bottom: 1px solid var(--border-2);
    display: flex;
    align-items: center;
    gap: 8px;
    transition: background 0.2s, border 0.2s, color 0.2s;
  }
  .output-header .spacer { flex: 1; }
  .output-header .rt { color: var(--text-5); }
  .output-header .fs-btn {
    background: var(--btn-bg);
    border: 1px solid var(--btn-border);
    color: var(--text-2);
    font-size: 11px;
    font-family: inherit;
    padding: 2px 8px;
    border-radius: 3px;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    gap: 4px;
    transition: all 0.15s;
  }
  .output-header .fs-btn:hover { background: var(--btn-hover); }

  #outputPane {
    flex: 1;
    padding: 12px 16px;
    font-family: 'Consolas', 'Cascadia Code', 'Courier New', monospace;
    font-size: 12.5px;
    line-height: 1.55;
    color: var(--output-text);
    background: var(--panel-2);
    overflow-y: auto;
    white-space: pre-wrap;
    word-break: break-word;
    min-height: 90px;
    transition: background 0.2s, color 0.2s;
  }
  #outputPane.empty { color: var(--text-5); font-style: italic; }
  #outputPane.error { color: var(--output-error); }
  #outputPane .md-render { color: var(--text); font-family: 'Calibri', 'Segoe UI', Arial, sans-serif; font-size: 14px; }
  #outputPane .md-render h1 { font-size: 20px; margin: 8px 0 4px; }
  #outputPane .md-render h2 { font-size: 16px; margin: 8px 0 4px; }
  #outputPane .md-render h3 { font-size: 14px; margin: 6px 0 3px; }
  #outputPane .md-render code { background: var(--md-code-bg); padding: 1px 5px; border-radius: 3px; font-family: Consolas, monospace; font-size: 12px; }
  #outputPane .md-render ul { margin: 4px 0 4px 20px; }
  #outputPane .md-render p { margin: 4px 0; }

  /* ---------- HTML Preview iframe ---------- */
  #htmlPreview {
    flex: 1;
    width: 100%;
    border: none;
    background: #ffffff;
    min-height: 150px;
    display: none;
  }
  #htmlPreview.active { display: block; }

  .runner-pane .actions {
    background: var(--panel-3);
    border-top: 1px solid var(--border-2);
    padding: 8px 12px;
    display: flex;
    gap: 6px;
    align-items: center;
    flex-shrink: 0;
    transition: background 0.2s, border 0.2s;
  }
  .runner-pane .actions button {
    background: var(--accent);
    color: #fff;
    border: none;
    padding: 6px 14px;
    border-radius: 3px;
    font-size: 12px;
    font-family: inherit;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    gap: 4px;
    transition: background 0.15s, transform 0.1s;
  }
  .runner-pane .actions button:hover { background: var(--accent-2); }
  .runner-pane .actions button:active { transform: scale(.98); }
  .runner-pane .actions button:disabled { background: #b0b0b0; cursor: not-allowed; }
  .runner-pane .actions button.secondary {
    background: var(--btn-bg);
    color: var(--text-2);
    border: 1px solid var(--btn-border);
  }
  .runner-pane .actions button.secondary:hover { background: var(--btn-hover); }
  .runner-pane .actions .hint { font-size: 10.5px; color: var(--text-5); margin-left: auto; }

  /* ---------- FULLSCREEN OVERLAY ---------- */
  .fs-overlay {
    position: fixed;
    inset: 0;
    background: var(--panel-2);
    z-index: 9999;
    display: none;
    flex-direction: column;
    transition: background 0.2s;
  }
  .fs-overlay.active { display: flex; }
  .fs-overlay .fs-bar {
    background: var(--panel-3);
    border-bottom: 1px solid var(--border);
    padding: 8px 14px;
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 12px;
    color: var(--text-2);
    flex-shrink: 0;
    transition: background 0.2s, border 0.2s, color 0.2s;
  }
  .fs-overlay .fs-bar .fs-title { font-weight: 600; color: var(--text); }
  .fs-overlay .fs-bar .spacer { flex: 1; }
  .fs-overlay .fs-bar button {
    background: var(--btn-bg);
    border: 1px solid var(--btn-border);
    color: var(--text-2);
    padding: 5px 12px;
    border-radius: 3px;
    font-size: 12px;
    font-family: inherit;
    cursor: pointer;
    transition: all 0.15s;
  }
  .fs-overlay .fs-bar button:hover { background: var(--btn-hover); }
  .fs-overlay .fs-bar button.primary {
    background: var(--accent);
    color: #fff;
    border-color: var(--accent);
  }
  .fs-overlay .fs-bar button.primary:hover { background: var(--accent-2); }
  .fs-overlay .fs-body {
    flex: 1;
    display: flex;
    overflow: hidden;
    min-height: 0;
  }
  .fs-overlay .fs-body.split-view .fs-code-side {
    width: 40%;
    border-right: 1px solid var(--border);
  }
  .fs-overlay .fs-code-side {
    width: 0;
    display: flex;
    flex-direction: column;
    background: var(--code-bg);
    overflow: hidden;
    transition: background 0.2s, width 0.15s;
  }
  .fs-overlay .fs-code-side textarea {
    flex: 1;
    width: 100%;
    border: none;
    outline: none;
    resize: none;
    padding: 14px 16px;
    font-family: 'Consolas', 'Cascadia Code', 'Courier New', monospace;
    font-size: 13px;
    line-height: 1.55;
    background: var(--code-bg);
    color: var(--text);
    caret-color: var(--accent);
  }
  .fs-overlay .fs-output-side {
    flex: 1;
    display: flex;
    flex-direction: column;
    min-width: 0;
    background: var(--panel-2);
    transition: background 0.2s;
  }
  .fs-overlay .fs-output-side iframe {
    flex: 1;
    width: 100%;
    border: none;
    background: #ffffff;
  }
  .fs-overlay .fs-output-side pre {
    flex: 1;
    margin: 0;
    padding: 16px 20px;
    font-family: 'Consolas', 'Cascadia Code', 'Courier New', monospace;
    font-size: 13px;
    line-height: 1.6;
    color: var(--output-text);
    overflow-y: auto;
    white-space: pre-wrap;
    word-break: break-word;
    background: var(--panel-2);
  }
  .fs-overlay .fs-output-side pre.error { color: var(--output-error); }
  .fs-overlay .fs-output-side .md-render {
    flex: 1;
    padding: 16px 20px;
    overflow-y: auto;
    background: var(--panel-2);
    color: var(--text);
  }

  /* ---------- Bottom bar ---------- */
  .blob-foot {
    background: var(--footer-bg);
    border-top: 1px solid var(--border);
    padding: 3px 14px;
    font-size: 10.5px;
    color: var(--text-4);
    display: flex;
    gap: 10px;
    align-items: center;
    flex-shrink: 0;
    transition: background 0.2s, border 0.2s, color 0.2s;
  }
  .blob-foot .dots { display: flex; gap: 4px; }
  .blob-foot .dots i {
    width: 7px; height: 7px; border-radius: 50%;
    display: inline-block;
  }
  .blob-foot .dots i:nth-child(1) { background: #e74c3c; }
  .blob-foot .dots i:nth-child(2) { background: #f39c12; }
  .blob-foot .dots i:nth-child(3) { background: #27ae60; }
  .blob-foot .dots i:nth-child(4) { background: #2980b9; }
  .blob-foot .dots i:nth-child(5) { background: #8e44ad; }

  /* ---------- responsive ---------- */
  @media (max-width: 820px) {
    .main { flex-direction: column; }
    .notes-pane { border-right: none; border-bottom: 1px solid var(--border); height: 50%; }
    .runner-pane { width: 100%; min-width: 0; height: 50%; }
  }
</style>
</head>
<body>

<!-- ===================== TITLE BAR ===================== -->
<div class="titlebar">
  <span class="app-name"><span class="logo">N</span> Notes</span>
  <span class="status-pill" id="statusPill">ready</span>
  <span class="spacer"></span>
  <button class="theme-btn" id="themeBtn" title="Toggle light/dark mode">🌙 Dark</button>
  <span style="font-size:11px;color:var(--text-5);" id="langCount">6 languages · 1 file</span>
</div>

<!-- ===================== MAIN ===================== -->
<div class="main">

  <!-- ---------- NOTES PANE (left) ---------- -->
  <div class="notes-pane">
    <div class="pane-toolbar">
      <span class="tool">File</span>
      <span class="tool">Edit</span>
      <span class="tool">Format</span>
      <span class="tool">View</span>
      <span class="sep"></span>
      <span class="tool" style="font-weight:600;">Notes</span>
      <span class="spacer"></span>
      <span id="lastSaved" style="font-size:11px;color:var(--text-5);"></span>
    </div>

    <textarea id="noteArea" placeholder="Type your notes here… everything saves automatically to your browser."></textarea>

    <div class="pane-footer">
      <span id="wordCount">0 characters</span>
      <span class="spacer"></span>
      <button class="danger" id="clearBtn">Clear notes</button>
    </div>
  </div>

  <!-- ---------- RUNNER PANE (right) ---------- -->
  <div class="runner-pane">

    <div class="tabs" id="tabs">
      <button class="tab active" data-lang="html">🌐 HTML</button>
      <button class="tab"        data-lang="js">✨ JS</button>
      <button class="tab"        data-lang="py">🐍 Python</button>
      <button class="tab"        data-lang="json">📦 JSON</button>
      <button class="tab"        data-lang="xml">📄 XML</button>
      <button class="tab"        data-lang="md">📝 Markdown</button>
    </div>

    <div class="editor-header">
      <span class="lang-name" id="codeTitle">HTML</span>
      <span class="spacer"></span>
      <span id="langHint"></span>
    </div>

    <div class="split">
      <textarea id="codeEditor" spellcheck="false"></textarea>

      <div class="output-wrap">
        <div class="output-header">
          <span>Output</span>
          <span class="spacer"></span>
          <span class="rt" id="runTime"></span>
          <button class="fs-btn" id="fsBtn" title="Fullscreen output">⛶ Fullscreen</button>
        </div>
        <div id="outputPane" class="empty">Press ▶ Run to execute</div>
        <iframe id="htmlPreview" sandbox="allow-scripts allow-modals allow-forms allow-popups allow-same-origin"></iframe>
      </div>
    </div>

    <div class="actions">
      <button id="runBtn">▶ Run</button>
      <button class="secondary" id="resetBtn">↺ Reset</button>
      <span class="hint" id="hint"></span>
    </div>

  </div>
</div>

<!-- ===================== FULLSCREEN OVERLAY ===================== -->
<div class="fs-overlay" id="fsOverlay">
  <div class="fs-bar">
    <span class="fs-title" id="fsTitle">HTML — fullscreen</span>
    <span class="spacer"></span>
    <button id="fsToggleCode" title="Show/hide code">◧ Toggle code</button>
    <button class="primary" id="fsClose">✕ Exit fullscreen</button>
  </div>
  <div class="fs-body" id="fsBody">
    <div class="fs-code-side" id="fsCodeSide">
      <textarea id="fsCodeEditor" spellcheck="false"></textarea>
    </div>
    <div class="fs-output-side" id="fsOutputSide"></div>
  </div>
</div>

<!-- ===================== BOTTOM BAR ===================== -->
<div class="blob-foot">
  <span class="dots"><i></i><i></i><i></i><i></i><i></i></span>

<script>
/* ================================================================
   THEME — light / dark, remembered in localStorage
   ================================================================ */
(function theme() {
  const KEY = 'notesTheme';
  const btn = document.getElementById('themeBtn');
  const html = document.documentElement;

  function apply(mode) {
    if (mode === 'dark') {
      html.classList.add('dark');
      btn.textContent = '☀️ Light';
    } else {
      html.classList.remove('dark');
      btn.textContent = '🌙 Dark';
    }
  }

  // load saved preference, else use system preference
  let saved = null;
  try { saved = localStorage.getItem(KEY); } catch (e) {}

  if (saved) {
    apply(saved);
  } else {
    const prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
    apply(prefersDark ? 'dark' : 'light');
  }

  btn.addEventListener('click', () => {
    const isDark = html.classList.contains('dark');
    const next = isDark ? 'light' : 'dark';
    apply(next);
    try { localStorage.setItem(KEY, next); } catch (e) {}
  });
})();

const META = {
  html: { title:'HTML',       hint:'renders live in the output frame — edit & run!' },
  js:   { title:'JavaScript', hint:'runs for real in your browser' },
  py:   { title:'Python',     hint:'runs for real via Pyodide (first run loads ~10MB)' },
  json: { title:'JSON',       hint:'validates and pretty-prints' },
  xml:  { title:'XML',        hint:'parses with DOMParser' },
  md:   { title:'Markdown',   hint:'rendered live with a mini parser' }
};

/* ================================================================
   NOTES APP — autosaves to localStorage
   ================================================================ */
(function notes() {
  const KEY = 'msNotesApp.v4';
  const noteArea    = document.getElementById('noteArea');
  const wordCount   = document.getElementById('wordCount');
  const lastSaved   = document.getElementById('lastSaved');
  const statusPill  = document.getElementById('statusPill');
  const clearBtn    = document.getElementById('clearBtn');
  let t;

  const updateCount = () => {
    const n = noteArea.value.length;
    wordCount.textContent = n + ' character' + (n === 1 ? '' : 's');
  };
  const setStatus = (txt, cls) => {
    statusPill.textContent = txt;
    statusPill.className = 'status-pill' + (cls ? ' ' + cls : '');
  };
  const save = () => {
    try {
      localStorage.setItem(KEY, noteArea.value);
      setStatus('saved', 'saved');
      lastSaved.textContent = '💾 ' + new Date().toLocaleTimeString();
    } catch (e) { setStatus('save failed', 'error'); }
  };
  const load = () => {
    try {
      const v = localStorage.getItem(KEY);
      if (v !== null) {
        noteArea.value = v;
        lastSaved.textContent = '💾 restored';
        setStatus('loaded', 'saved');
      } else setStatus('ready');
    } catch (e) { setStatus('storage unavailable', 'error'); }
    updateCount();
  };

  noteArea.addEventListener('input', () => {
    setStatus('typing…');
    clearTimeout(t);
    t = setTimeout(() => { save(); updateCount(); }, 300);
  });
  noteArea.addEventListener('blur', () => { clearTimeout(t); save(); updateCount(); });
  window.addEventListener('beforeunload', save);

  clearBtn.addEventListener('click', () => {
    if (!confirm('Clear all notes?')) return;
    noteArea.value = '';
    try { localStorage.removeItem(KEY); } catch (e) {}
    updateCount(); setStatus('cleared'); lastSaved.textContent = '';
  });

  load();
})();

/* ================================================================
   RUNNERS — only real ones
   ================================================================ */
let pyodideReady = null;
async function getPyodide() {
  if (pyodideReady) return pyodideReady;
  if (!window.loadPyodide) {
    await new Promise((res, rej) => {
      const s = document.createElement('script');
      s.src = 'https://cdn.jsdelivr.net/pyodide/v0.26.2/full/pyodide.js';
      s.onload = res;
      s.onerror = () => rej(new Error('Could not load Pyodide'));
      document.head.appendChild(s);
    });
  }
  pyodideReady = await window.loadPyodide({
    indexURL: 'https://cdn.jsdelivr.net/pyodide/v0.26.2/full/'
  });
  return pyodideReady;
}

function runJS(code) {
  const logs = [];
  const fmt = (args) => args.map(a => {
    if (typeof a === 'object' && a !== null) {
      try { return JSON.stringify(a); } catch (e) { return String(a); }
    }
    return String(a);
  }).join(' ');
  const fakeConsole = {
    log:   (...a) => logs.push(fmt(a)),
    error: (...a) => logs.push('[error] ' + fmt(a)),
    warn:  (...a) => logs.push('[warn] ' + fmt(a)),
    info:  (...a) => logs.push('[info] ' + fmt(a))
  };
  try {
    const fn = new Function('console', code);
    fn(fakeConsole);
    return logs.length ? logs.join('\n') : '(ran with no output)';
  } catch (e) { return '❌ ' + e.message; }
}

function runJSON(code) {
  try {
    const obj = JSON.parse(code);
    return '✅ valid JSON\n\n' + JSON.stringify(obj, null, 2);
  } catch (e) { return '❌ invalid JSON: ' + e.message; }
}

function runXML(code) {
  try {
    const doc = new DOMParser().parseFromString(code, 'application/xml');
    const err = doc.querySelector('parsererror');
    if (err) return '❌ invalid XML: ' + err.textContent.split('\n')[0];
    const root = doc.documentElement;
    const out = ['✅ valid XML', '', 'root: <' + root.tagName + '>'];
    const walk = (el, depth) => {
      for (const child of el.children) {
        out.push('  '.repeat(depth) + '↳ <' + child.tagName + '>');
        for (const a of child.attributes) {
          out.push('  '.repeat(depth + 1) + '@' + a.name + ' = "' + a.value + '"');
        }
        walk(child, depth + 1);
      }
    };
    walk(root, 1);
    const meta = doc.querySelector('meta');
    if (meta) {
      out.push('');
      out.push('meta: count=' + meta.getAttribute('count') + ' file=' + meta.getAttribute('file'));
    }
    return out.join('\n');
  } catch (e) { return '❌ ' + e.message; }
}

function renderMarkdown(md) {
  let html = md;
  html = html.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  html = html.replace(/```(\w*)\n([\s\S]*?)```/g, (_, lang, code) =>
    '<pre style="background:var(--md-code-bg);padding:.5rem;border-radius:5px;overflow:auto;font-family:Consolas,monospace;font-size:12px;">' +
    code.replace(/</g,'&lt;') + '</pre>');
  html = html.replace(/^### (.*)$/gm, '<h3>$1</h3>');
  html = html.replace(/^## (.*)$/gm,  '<h2>$1</h2>');
  html = html.replace(/^# (.*)$/gm,   '<h1>$1</h1>');
  html = html.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
  html = html.replace(/_(.+?)_/g,       '<em>$1</em>');
  html = html.replace(/`([^`]+)`/g,     '<code>$1</code>');
  html = html.replace(/^> (.*)$/gm, '<blockquote style="border-left:3px solid var(--accent);padding-left:.6rem;color:var(--text-3);margin:.4rem 0;">$1</blockquote>');
  html = html.replace(/^- (.*)$/gm, '<li>$1</li>');
  html = html.replace(/(<li>.*<\/li>\n?)+/g, m => '<ul>' + m + '</ul>');
  html = html.split(/\n{2,}/).map(p => {
    if (/^\s*<(h\d|ul|pre|blockquote)/.test(p)) return p;
    return '<p>' + p.replace(/\n/g, '<br>') + '</p>';
  }).join('\n');
  return '<div class="md-render">' + html + '</div>';
}

function runMarkdown(code) { return { html: renderMarkdown(code) }; }

/* ================================================================
   UI WIRING
   ================================================================ */
const codeEditor  = document.getElementById('codeEditor');
const codeTitle   = document.getElementById('codeTitle');
const outputPane  = document.getElementById('outputPane');
const htmlPreview = document.getElementById('htmlPreview');
const runBtn      = document.getElementById('runBtn');
const resetBtn    = document.getElementById('resetBtn');
const runTime     = document.getElementById('runTime');
const hint        = document.getElementById('hint');
const tabs        = document.getElementById('tabs');
const langHint    = document.getElementById('langHint');
const fsBtn       = document.getElementById('fsBtn');
const fsOverlay   = document.getElementById('fsOverlay');
const fsTitle     = document.getElementById('fsTitle');
const fsCodeSide  = document.getElementById('fsCodeSide');
const fsCodeEditor= document.getElementById('fsCodeEditor');
const fsOutputSide= document.getElementById('fsOutputSide');
const fsBody      = document.getElementById('fsBody');
const fsClose     = document.getElementById('fsClose');
const fsToggleCode= document.getElementById('fsToggleCode');

let currentLang = 'html';

function showTextOutput() {
  outputPane.style.display = '';
  htmlPreview.classList.remove('active');
  htmlPreview.style.display = 'none';
}
function showHtmlOutput() {
  outputPane.style.display = 'none';
  htmlPreview.style.display = 'block';
  htmlPreview.classList.add('active');
}
function setOutput(text, isError) {
  showTextOutput();
  outputPane.innerHTML = '';
  outputPane.textContent = text;
  outputPane.classList.toggle('error', !!isError);
  outputPane.classList.toggle('empty', !text);
}
function setOutputHTML(html) {
  showTextOutput();
  outputPane.innerHTML = html;
  outputPane.classList.remove('error');
  outputPane.classList.remove('empty');
}
function runHtmlPreview(code, targetIframe) {
  const frame = targetIframe || htmlPreview;
  if (!targetIframe) showHtmlOutput();
  const doc = frame.contentDocument || frame.contentWindow.document;
  doc.open();
  doc.write(code);
  doc.close();
}
function loadSnippet(lang) {
  codeEditor.value = BLOB[lang];
  codeTitle.textContent = META[lang].title;
  hint.textContent = META[lang].hint;
  langHint.textContent = META[lang].hint;

  if (lang === 'html') {
    runHtmlPreview(BLOB.html);
    runTime.textContent = '';
  } else {
    setOutput('Press ▶ Run to execute');
    runTime.textContent = '';
  }
}
function selectTab(lang) {
  currentLang = lang;
  document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t.dataset.lang === lang));
  loadSnippet(lang);
}

tabs.addEventListener('click', e => {
  const btn = e.target.closest('.tab');
  if (!btn) return;
  selectTab(btn.dataset.lang);
});

resetBtn.addEventListener('click', () => {
  if (!confirm('Reset this snippet to its default?')) return;
  loadSnippet(currentLang);
});

/* ---------- execute a snippet and return { html?, text?, error? } ---------- */
async function executeSnippet(code, lang) {
  if (lang === 'html') return { html: code };
  if (lang === 'js') {
    const r = runJS(code);
    return { text: r, error: r.startsWith('❌') };
  }
  if (lang === 'py') {
    try {
      const py = await getPyodide();
      const captured = [];
      py.setStdout({ batched: s => captured.push(s) });
      py.setStderr({ batched: s => captured.push(s) });
      await py.runPythonAsync(code);
      const r = captured.join('') || '(ran with no output)';
      return { text: r };
    } catch (e) {
      return { text: '❌ ' + (e.message || e), error: true };
    }
  }
  if (lang === 'json') return { text: runJSON(code) };
  if (lang === 'xml')  return { text: runXML(code) };
  if (lang === 'md')   return { html: renderMarkdown(code) };
  return { text: '(unknown language)' };
}

runBtn.addEventListener('click', async () => {
  const code = codeEditor.value;
  const lang = currentLang;
  const t0 = performance.now();
  runBtn.disabled = true;
  runTime.textContent = '';

  try {
    if (lang === 'html') {
      runHtmlPreview(code);
      runTime.textContent = (performance.now() - t0).toFixed(0) + ' ms';
      runBtn.disabled = false;
      return;
    }

    setOutput('Running…');
    const result = await executeSnippet(code, lang);
    if (result.html !== undefined) {
      setOutputHTML(result.html);
    } else {
      setOutput(result.text, !!result.error);
    }
    runTime.textContent = (performance.now() - t0).toFixed(0) + ' ms';
  } catch (e) {
    setOutput('❌ ' + e.message, true);
  } finally {
    runBtn.disabled = false;
  }
});

/* ================================================================
   FULLSCREEN OUTPUT
   ================================================================ */
let fsIframe = null;

function buildFsOutput() {
  fsOutputSide.innerHTML = '';
  fsIframe = null;
}

function openFullscreen() {
  fsTitle.textContent = META[currentLang].title + ' — fullscreen';
  fsCodeEditor.value = codeEditor.value;
  fsBody.classList.add('split-view');

  buildFsOutput();

  (async () => {
    const code = codeEditor.value;
    const lang = currentLang;

    if (lang === 'html') {
      fsIframe = document.createElement('iframe');
      fsIframe.setAttribute('sandbox', 'allow-scripts allow-modals allow-forms allow-popups allow-same-origin');
      fsOutputSide.appendChild(fsIframe);
      requestAnimationFrame(() => {
        const doc = fsIframe.contentDocument || fsIframe.contentWindow.document;
        doc.open();
        doc.write(code);
        doc.close();
      });
    } else {
      const result = await executeSnippet(code, lang);
      if (result.html !== undefined) {
        const div = document.createElement('div');
        div.className = 'md-render';
        div.style.flex = '1';
        div.style.overflowY = 'auto';
        div.innerHTML = result.html;
        fsOutputSide.appendChild(div);
      } else {
        const pre = document.createElement('pre');
        pre.textContent = result.text;
        if (result.error) pre.classList.add('error');
        fsOutputSide.appendChild(pre);
      }
    }
  })();

  fsOverlay.classList.add('active');
  fsCodeEditor.addEventListener('input', syncFromFs);
}

function closeFullscreen() {
  fsOverlay.classList.remove('active');
  codeEditor.value = fsCodeEditor.value;
  fsCodeEditor.removeEventListener('input', syncFromFs);
  fsIframe = null;
}

function syncFromFs() {
  codeEditor.value = fsCodeEditor.value;
}

fsBtn.addEventListener('click', openFullscreen);
fsClose.addEventListener('click', closeFullscreen);
fsToggleCode.addEventListener('click', () => {
  if (fsBody.classList.contains('split-view')) {
    fsBody.classList.remove('split-view');
    fsToggleCode.textContent = '◨ Show code';
  } else {
    fsBody.classList.add('split-view');
    fsToggleCode.textContent = '◧ Toggle code';
  }
});

document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape' && fsOverlay.classList.contains('active')) {
    closeFullscreen();
  }
});

/* init */
selectTab('html');
</script>
